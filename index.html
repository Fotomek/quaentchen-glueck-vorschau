<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Quäntchen Glück e. V. · Vorschau</title>
<style>
  :root { --gruen:#1f4d36; --hell:#e8f1e4; --creme:#fbf8f1; --text:#23302a; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--creme); color:var(--text); line-height:1.6; }
  main { max-width:720px; margin:0 auto; padding:4rem 1.5rem; text-align:center; }
  .marke { display:inline-block; width:64px; height:64px; border-radius:50%; background:var(--hell); color:var(--gruen); font-size:2rem; line-height:64px; margin-bottom:1rem; }
  h1 { color:var(--gruen); font-size:2.2rem; margin:.2rem 0 .5rem; }
  p.lead { font-size:1.15rem; margin:0 0 2rem; }
  .karte { background:#fff; border:1px solid #dfe8da; border-radius:14px; padding:1.5rem; text-align:left; }
  .karte h2 { color:var(--gruen); font-size:1.1rem; margin:0 0 .5rem; }
  .karte ul { margin:.3rem 0 0; padding-left:1.2rem; }
  footer { margin-top:2.5rem; font-size:.9rem; color:#5b6a62; }
</style>
</head>
<body>
<main>
  <div class="marke" aria-hidden="true">☘</div>
  <h1>Quäntchen Glück e. V.</h1>
  <p class="lead">Hier entsteht die neue Webseite des Vereins.</p>
  <div class="karte">
    <h2>Projektinfo</h2>
    <ul>
      <li>Vorschau der geplanten Landingpage, nicht final</li>
      <li>Inhalte und Gestaltung werden gemeinsam mit dem Verein abgestimmt</li>
      <li>Diese Seite ist nicht für Suchmaschinen bestimmt</li>
    </ul>
  </div>
  <footer>Vorschau erstellt von Fotomek</footer>
</main>
</body>
</html>
